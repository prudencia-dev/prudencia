name: CI

on:
  pull_request:
  workflow_dispatch:

# Une nouvelle exécution remplace l'ancienne lorsque la même PR est mise à jour.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/fastapi/requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r data/fastapi/requirements-ci.txt

      # Le contrôle Ruff est volontairement limité aux erreurs bloquantes.
      # Le dépôt historique sera normalisé progressivement avant d'activer
      # l'ensemble des règles de style.
      - name: Check blocking Python errors
        run: ruff check --select E9,F63,F7,F82 data notebooks

      - name: Compile Python sources
        run: python -m compileall -q data/fastapi/app data/streamlit

      - name: Run unit tests
        env:
          PYTHONPATH: data/fastapi
        run: >-
          pytest -q data/fastapi/tests
          -o cache_dir=/tmp/prudencia-pytest-cache

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare non-secret development variables
        run: cp compose/dev/.env.example compose/dev/.env

      - name: Validate Compose configuration
        run: docker compose -f compose/dev/compose.yaml config --quiet

  postgres-schema:
    name: PostgreSQL schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Le conteneur utilise le même mécanisme d'initialisation que le poste
      # local : les scripts sont lus par docker-entrypoint-initdb.d.
      - name: Initialize a clean PostgreSQL database
        run: |
          docker run --detach \
            --name prudencia-ci-postgres \
            --env POSTGRES_DB=prudencia_ci \
            --env POSTGRES_USER=prudencia \
            --env POSTGRES_PASSWORD=ci-only-password \
            --volume "$PWD/config/init:/docker-entrypoint-initdb.d:ro" \
            postgres:16

          for attempt in {1..30}; do
            if docker exec prudencia-ci-postgres \
              pg_isready -U prudencia -d prudencia_ci; then
              exit 0
            fi
            sleep 1
          done

          docker logs prudencia-ci-postgres
          exit 1

      - name: Verify expected tables
        run: |
          table_count="$(docker exec prudencia-ci-postgres \
            psql -U prudencia -d prudencia_ci -tAc \
            "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'prudencia';")"

          test "$table_count" = "6"

      - name: Show initialization logs on failure
        if: failure()
        run: docker logs prudencia-ci-postgres

      - name: Remove temporary database
        if: always()
        run: docker rm --force prudencia-ci-postgres
